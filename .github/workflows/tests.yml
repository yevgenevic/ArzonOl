name: Regression tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/frontend.test.js

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      # .env, database and backups live only on the server and must never be overwritten.
      - name: Upload code
        run: >
          rsync -az --exclude .git --exclude .github --exclude .venv --exclude __pycache__
          --exclude backend/.env --exclude '*.db' --exclude backend/backups
          ./ root@109.199.109.144:/opt/arzonol/
      - name: Install dependencies and restart
        run: |
          ssh root@109.199.109.144 'cd /opt/arzonol && .venv/bin/pip install -q -r backend/requirements.txt && systemctl restart arzonol && sleep 3 && systemctl is-active arzonol'
          curl -fsS -o /dev/null https://109-199-109-144.sslip.io/
