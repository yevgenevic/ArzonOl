<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArzonOL — агрегатор цен на мебель, технику и стройматериалы в Узбекистане</title>
<meta name="description" content="ArzonOL — агрегатор цен в Узбекистане. Сравнивайте предложения ведущих маркетплейсов (Uzum, Olcha, Texnomart, Mediapark и др.) и покупайте выгоднее.">
<link rel="icon" type="image/png" href="/assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/styles.css">
<style>
  svg { width: 20px; height: 20px; vertical-align: middle; }
  header, main, section, nav, footer { box-sizing: border-box; }
</style>
</head>
<body>

<!-- Иконки: один спрайт, используется через <use> -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-heart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20s-7-4.4-7-9.2A4.2 4.2 0 0 1 12 8a4.2 4.2 0 0 1 7 2.8C19 15.6 12 20 12 20z"/>
    </symbol>
    <symbol id="i-compare" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 20V10M12 20V4M6 20v-6"/>
    </symbol>
    <symbol id="i-external" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14L21 3"/>
    </symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h13"/><path d="m12.5 6 6 6-6 6"/>
    </symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m9 5 7 7-7 7"/>
    </symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m15 5-7 7 7 7"/>
    </symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m6 9 6 6 6-6"/>
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M5 5l14 14M19 5 5 19"/>
    </symbol>
    <symbol id="i-star" viewBox="0 0 24 24" fill="currentColor">
      <path d="m12 2.6 2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5 6.1 20.6l1.2-6.5L2.5 9.5l6.6-.9z"/>
    </symbol>
    <symbol id="i-spark" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2.5 13.8 9l6.5 1.8-6.5 1.8L12 19.1l-1.8-6.5L3.7 10.8 10.2 9z"/>
    </symbol>
    <symbol id="i-bed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 18v-7h18v7"/><path d="M3 14h18"/><path d="M6 11V8h5v3"/><path d="M3 18v2M21 18v2"/>
    </symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="12" rx="2"/><path d="M9 21h6M12 17v4"/>
    </symbol>
    <symbol id="i-house" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 11 12 4l8 7"/><path d="M6 10v10h12V10"/>
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
    </symbol>
    <symbol id="i-map-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>
    </symbol>
    <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
    </symbol>
    <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>
    </symbol>
    <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6 9 17l-5-5"/>
    </symbol>
  </defs>
</svg>

<!-- Верхний навбар: зафиксирован вверху страницы -->
<header class="topnav" id="topnav">
  <div class="topnav__inner">
    <a class="topnav__logo" href="#">
      <img src="/assets/img/logo.png" alt="ArzonOL" class="topnav__logo-img">
      <span class="topnav__brand">Arzon<span class="brand-green">OL</span></span>
    </a>

    <!-- Текстовые ссылки категорий -->
    <nav class="topnav__nav" id="topnav-cats" data-i18n-attr="aria-label:categories.aria"></nav>

    <!-- Поиск в шапке при скролле -->
    <div class="topnav__search" id="topnav-search">
      <form class="search__field search__field--top" id="search-form-top" autocomplete="off" role="search">
        <label class="visually-hidden" for="q-top" data-i18n="search.label"></label>
        <input class="search__input" id="q-top" name="q-top" type="search"
               data-i18n-attr="placeholder:search.placeholder">
        <button class="search__clear" type="button" id="search-clear-top" hidden data-i18n-attr="aria-label:search.clear"><svg><use href="#i-close"/></svg></button>
        <button class="search__submit" type="submit" data-i18n-attr="aria-label:search.submit"><svg><use href="#i-arrow-right"/></svg></button>
      </form>
      <div class="search__suggest" id="suggest-top" hidden role="listbox"></div>
    </div>

    <div class="topnav__actions">
      <!-- Селектор города/региона -->
      <div class="region-select" id="region-select-wrap">
        <button class="region-select__btn" type="button" id="region-btn" aria-haspopup="listbox" aria-expanded="false">
          <svg class="region-select__icon"><use href="#i-map-pin"/></svg>
          <span id="region-current-label">Ташкент</span>
          <svg class="region-select__chevron"><use href="#i-chevron-down"/></svg>
        </button>
        <div class="region-select__dropdown" id="region-dropdown" hidden role="listbox"></div>
      </div>

      <!-- Переключатель тёмной темы -->
      <button class="topnav__btn" type="button" id="theme-toggle" data-i18n-attr="title:theme.toggle,aria-label:theme.toggle">
        <svg class="icon-theme icon-moon"><use href="#i-moon"/></svg>
        <svg class="icon-theme icon-sun"><use href="#i-sun"/></svg>
      </button>

      <button class="topnav__btn" type="button" data-nav="favorites" data-i18n-attr="title:nav.favorites,aria-label:nav.favorites">
        <svg><use href="#i-heart"/></svg>
        <span class="topnav__badge" id="badge-fav" hidden>0</span>
      </button>
      <button class="topnav__btn" type="button" data-open-compare data-i18n-attr="title:nav.compare,aria-label:nav.compare">
        <svg><use href="#i-compare"/></svg>
        <span class="topnav__badge" id="badge-compare" hidden>0</span>
      </button>
      <div class="lang" id="lang" role="group" data-i18n-attr="aria-label:lang.aria"></div>
    </div>
  </div>
</header>

<div class="shell">

  <!-- Нижний бар — только мобильный -->
  <nav class="rail" id="rail" data-i18n-attr="aria-label:categories.aria"></nav>

  <main class="content">

    <!-- Hero -->
    <section class="hero">
      <div class="hero__stage">
        <div class="constellation" id="constellation"></div>
      </div>

      <div class="page">
        <div class="hero__brand-header">
          <img src="/assets/img/logo.png" alt="ArzonOL" class="hero__logo-img">
          <h1 class="wordmark">Arzon<span class="wordmark__accent">OL</span></h1>
        </div>
        <p class="hero__tagline" data-i18n="hero.tagline"></p>

        <div class="search" role="search">
          <form class="search__field" id="search-form" autocomplete="off">
            <label class="visually-hidden" for="q" data-i18n="search.label"></label>
            <input class="search__input" id="q" name="q" type="search" aria-describedby="search-hint"
                   data-i18n-attr="placeholder:search.placeholder">
            <button class="search__clear" type="button" id="search-clear" hidden data-i18n-attr="aria-label:search.clear"><svg><use href="#i-close"/></svg></button>
            <button class="search__submit" type="submit" data-i18n-attr="aria-label:search.submit"><svg><use href="#i-arrow-right"/></svg></button>
          </form>
          <span class="visually-hidden" id="search-hint" data-i18n="search.hint"></span>
          <div class="search__suggest" id="suggest" hidden role="listbox"></div>
        </div>

        <!-- Category pills -->
        <div class="categories" id="categories" role="group" data-i18n-attr="aria-label:categories.aria"></div>
      </div>
    </section>

    <div class="page">

      <!-- Панель сортировки и умных фильтров -->
      <div class="controls-bar" id="controls-bar">
        <div class="controls-bar__sort">
          <label class="controls-bar__label" for="sort-select" data-i18n="sort.label"></label>
          <div class="select-wrap">
            <select class="select" id="sort-select">
              <option value="priceAsc" data-i18n="sort.priceAsc"></option>
              <option value="savingsDesc" data-i18n="sort.savingsDesc"></option>
              <option value="ratingDesc" data-i18n="sort.ratingDesc"></option>
              <option value="popularDesc" data-i18n="sort.popularDesc"></option>
            </select>
            <svg class="select-arrow"><use href="#i-chevron-down"/></svg>
          </div>
        </div>

        <div class="controls-bar__filters">
          <button class="filter-pill" type="button" id="filter-stock" aria-pressed="false">
            <svg class="filter-pill__icon"><use href="#i-check"/></svg>
            <span data-i18n="filter.inStock"></span>
          </button>
          <div class="platform-chips" id="platform-chips"></div>
        </div>
      </div>

      <!-- Результаты поиска / фильтра / отслеживаемых -->
      <section class="results section" id="results" hidden aria-live="polite">
        <div class="section__head">
          <h2 class="section__title" id="results-title">Результаты</h2>
          <button class="section__chevron" type="button" data-reset data-i18n-attr="title:results.reset,aria-label:results.reset"><svg><use href="#i-close"/></svg></button>
          <span class="section__count" id="results-count"></span>
        </div>
        <div class="grid" id="results-grid"></div>
      </section>

      <!-- Три категории: точка входа в каталог -->
      <section class="cats" id="cats" aria-labelledby="cats-title">
        <div class="cats__head">
          <h2 class="cats__title" id="cats-title" data-i18n="cats.title"></h2>
          <p class="cats__sub" data-i18n="cats.sub"></p>
        </div>
        <div class="cats__grid" id="cats-grid"></div>
      </section>

      <!-- Ленты по категориям + самые популярные с выгодой -->
      <div class="sections" id="sections"></div>
    </div>

    <!-- Маркетплейсы и бренды: светлая полоса во всю ширину -->
    <section class="partners" id="partners" aria-labelledby="partners-title">
      <div class="page">
        <div class="partners__head">
          <h2 class="partners__title" id="partners-title" data-i18n="partners.title"></h2>
          <p class="partners__sub" data-i18n="partners.sub"></p>
        </div>
      </div>
      <div class="partners__viewport">
        <div class="partners__track" id="partners-track"></div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer__inner">
        <div>
          <div class="footer__mark">
            <img src="/assets/img/logo.png" alt="ArzonOL" class="footer__logo-img">
            <span>Arzon<span class="brand-green">OL</span></span>
          </div>
          <p class="footer__blurb" data-i18n="footer.blurb"></p>
        </div>
        <div class="footer__col">
          <h3 data-i18n="footer.shop"></h3>
          <ul>
            <li><a href="#" data-i18n="footer.link.selections"></a></li>
            <li><a href="#" data-i18n="footer.link.brands"></a></li>
            <li><a href="#" data-i18n="footer.link.new"></a></li>
            <li><a href="#" data-i18n="footer.link.sale"></a></li>
          </ul>
        </div>
        <div class="footer__col">
          <h3 data-i18n="footer.help"></h3>
          <ul>
            <li><a href="#" data-i18n="footer.link.delivery"></a></li>
            <li><a href="#" data-i18n="footer.link.returns"></a></li>
            <li><a href="#" data-i18n="footer.link.tracking"></a></li>
            <li><a href="#" data-i18n="footer.link.support"></a></li>
          </ul>
        </div>
        <div class="footer__col">
          <h3 data-i18n="footer.company"></h3>
          <ul>
            <li><a href="#" data-i18n="footer.link.about"></a></li>
            <li><a href="#" data-i18n="footer.link.jobs"></a></li>
            <li><a href="#" data-i18n="footer.link.press"></a></li>
            <li><a href="#" data-i18n="footer.link.partners"></a></li>
          </ul>
        </div>
      </div>

      <!-- Юридический дисклеймер агрегатора -->
      <div class="footer__disclaimer-box">
        <p class="footer__disclaimer-text" data-i18n="footer.disclaimer"></p>
      </div>

      <div class="footer__base">
        <span>© 2026 ArzonOL — Агрегатор цен</span>
        <span data-i18n="footer.legal"></span>
      </div>
    </footer>

  </main>
</div>

<!-- Модалка товара: блок сравнения цен на маркетплейсах -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="sheet-brand" hidden>
  <div class="sheet" id="sheet">
    <button class="sheet__close" type="button" data-close-sheet data-i18n-attr="aria-label:sheet.close"><svg><use href="#i-close"/></svg></button>
    <div class="sheet__media">
      <img id="sheet-image" src="" alt="">
      <div class="sheet__thumbs" id="sheet-thumbs"></div>

      <!-- График истории цен -->
      <div class="sheet__chart-box">
        <div class="sheet__chart-header">
          <div class="sheet__chart-title-wrap">
            <svg class="sheet__chart-icon"><use href="#i-chart"/></svg>
            <span class="sheet__chart-title" data-i18n="chart.title"></span>
          </div>
          <span class="sheet__trend-badge" id="sheet-trend-badge"></span>
        </div>
        <div class="sheet__chart-canvas" id="sheet-chart"></div>
      </div>
    </div>

    <div class="sheet__body">
      <div class="sheet__header">
        <h2 class="sheet__brand" id="sheet-brand"></h2>
        <p class="sheet__title" id="sheet-title"></p>
        <div class="sheet__rating" id="sheet-rating"></div>
      </div>

      <div class="sheet__price-panel">
        <div class="sheet__price" id="sheet-price"></div>
        <div class="sheet__savings-badge" id="sheet-savings"></div>
      </div>

      <p class="sheet__desc" id="sheet-desc"></p>

      <div class="sheet__offers-section">
        <div class="sheet__offers-heading" data-i18n="sheet.offersTitle"></div>
        <div class="sheet__offers-table" id="sheet-offers"></div>
        <p class="sheet__disclaimer" data-i18n="sheet.disclaimer"></p>
      </div>

      <div class="sheet__actions">
        <button class="btn btn--primary" type="button" id="sheet-compare">
          <svg><use href="#i-compare"/></svg>
          <span id="sheet-compare-label" data-i18n="sheet.compareAdd"></span>
        </button>
        <button class="btn btn--ghost" type="button" id="sheet-alert-btn" data-i18n-attr="title:alert.btn,aria-label:alert.btn">
          <svg><use href="#i-bell"/></svg>
        </button>
        <button class="btn btn--ghost" type="button" id="sheet-fav" data-i18n-attr="title:sheet.trackPrice,aria-label:sheet.trackPrice">
          <svg><use href="#i-heart"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Модалка: подписка на снижение цены -->
<div class="overlay overlay--alert" id="alert-modal" role="dialog" aria-modal="true" aria-labelledby="alert-modal-title" hidden>
  <div class="alert-box">
    <button class="alert-box__close" type="button" data-close-alert data-i18n-attr="aria-label:sheet.close"><svg><use href="#i-close"/></svg></button>
    <div class="alert-box__head">
      <div class="alert-box__icon"><svg><use href="#i-bell"/></svg></div>
      <h2 class="alert-box__title" id="alert-modal-title" data-i18n="alert.title"></h2>
      <p class="alert-box__subtitle" data-i18n="alert.subtitle"></p>
    </div>
    <form class="alert-box__form" id="alert-form">
      <div class="form-group">
        <label class="form-label" for="alert-target-price" data-i18n="alert.targetLabel"></label>
        <input class="form-input" id="alert-target-price" type="number" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="alert-contact" data-i18n="alert.contactLabel"></label>
        <input class="form-input" id="alert-contact" type="text" placeholder="@username или name@mail.uz" required>
      </div>
      <button class="btn btn--primary alert-box__submit" type="submit" data-i18n="alert.submit"></button>
    </form>
  </div>
</div>

<!-- Выдвижная панель: список сравнения -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" data-i18n-attr="aria-label:compare.drawerTitle" aria-hidden="true">
  <div class="drawer__head">
    <div class="drawer__title-wrap">
      <svg class="drawer__title-icon"><use href="#i-compare"/></svg>
      <h2 class="drawer__title" data-i18n="compare.drawerTitle"></h2>
    </div>
    <button class="drawer__close" type="button" data-close-compare data-i18n-attr="aria-label:sheet.close"><svg><use href="#i-close"/></svg></button>
  </div>
  <div class="drawer__list" id="compare-list"></div>
  
  <!-- Калькулятор общей экономии комплекта -->
  <div class="drawer__bundle-summary" id="drawer-bundle"></div>

  <div class="drawer__foot">
    <button class="btn btn--primary" type="button" id="open-compare-modal" data-i18n="compare.openModal"></button>
    <button class="btn btn--ghost btn--clear" type="button" id="clear-compare" data-i18n="compare.clear"></button>
  </div>
</aside>

<!-- Модальное окно: подробная таблица сравнения товаров -->
<div class="overlay overlay--compare" id="compare-modal" role="dialog" aria-modal="true" aria-labelledby="compare-modal-title" hidden>
  <div class="compare-modal">
    <div class="compare-modal__head">
      <div class="compare-modal__title-wrap">
        <svg class="compare-modal__title-icon"><use href="#i-compare"/></svg>
        <h2 class="compare-modal__title" id="compare-modal-title" data-i18n="compare.modalTitle"></h2>
      </div>
      <button class="compare-modal__close" type="button" data-close-compare-modal data-i18n-attr="aria-label:sheet.close"><svg><use href="#i-close"/></svg></button>
    </div>
    <div class="compare-modal__body" id="compare-table-container"></div>
  </div>
</div>

<!-- Cookie consent -->
<div class="cookie" id="cookie" hidden>
  <p class="cookie__text">
    <span data-i18n="cookie.text"></span> <a href="#" data-i18n="cookie.link"></a>.
  </p>
  <div class="cookie__actions">
    <button class="cookie__btn" type="button" data-cookie="reject" data-i18n="cookie.reject"></button>
    <button class="cookie__btn" type="button" data-cookie="accept" data-i18n="cookie.accept"></button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/data.js"></script>
<script src="/assets/js/app.js"></script>
</body>
</html>
